<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artificial Life Simulation with Bloom Shader</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #stats {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="stats"></div>
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        
        function createParticles() {
            const particleCount = 2000;
            const particlesGeometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            const velocityArray = new Float32Array(particleCount * 3);
            const colorArray = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                posArray[i3] = (Math.random() - 0.5) * 50;
                posArray[i3 + 1] = (Math.random() - 0.5) * 50;
                posArray[i3 + 2] = (Math.random() - 0.5) * 50;
                
                velocityArray[i3] = (Math.random() - 0.5) * 0.05;
                velocityArray[i3 + 1] = (Math.random() - 0.5) * 0.05;
                velocityArray[i3 + 2] = (Math.random() - 0.5) * 0.05;
                
                colorArray[i3] = Math.random() * 0.5 + 0.5;
                colorArray[i3 + 1] = Math.random() * 0.5 + 0.5;
                colorArray[i3 + 2] = Math.random() * 0.5 + 0.5;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particlesGeometry.setAttribute('velocity', new THREE.BufferAttribute(velocityArray, 3));
            particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
            
            const particleMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0.0 },
                    mousePosition: { value: new THREE.Vector2(0, 0) },
                    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                },
vertexShader: `
                     attribute vec3 color;
                     uniform float time;
                     uniform vec2 mousePosition;
                     uniform vec2 resolution;
                    
                    varying vec3 vColor;
                    varying vec2 vNoise;
                    
                    void main() {
                        vColor = color;
                        
                        vec2 mouse = mousePosition / resolution.xy;
                        vec2 dir = normalize(position.xz - mouse * 100.0);
                        float dist = length(position.xz - mouse * 100.0);
                        
                        vec3 newPos = position;
                        if (dist < 5.0) {
                            newPos.xz += dir * 0.1;
                            newPos.y += sin(time * 3.0) * 0.1;
                        }
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                        gl_PointSize = 2.0;
                        vNoise = vec2(dist, sin(time * 0.5));
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying vec2 vNoise;
                    uniform float time;
                    
                    void main() {
                        float pulse = sin(time * 2.0 + vNoise.y * 10.0) * 0.5 + 0.5;
                        float energy = vNoise.x * 0.1 + pulse * 0.3;
                        
                        float r = vColor.r * (1.0 + energy * 0.5);
                        float g = vColor.g * (1.0 + energy * 0.2);
                        float b = vColor.b * (1.0 + energy * 0.8);
                        
                        gl_FragColor = vec4(r, g, b, 1.0);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(particlesGeometry, particleMaterial);
            return { particles, particleMaterial, particlesGeometry };
        }
        
        const { particles, particleMaterial, particlesGeometry } = createParticles();
        scene.add(particles);
        
        camera.position.z = 50;
        
        const particleCount = particles.geometry.attributes.position.array.length / 3;
        let velocityArray = particles.geometry.attributes.velocity.array;
        let colorArray = particles.geometry.attributes.color.array;
        
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.elapsedTime;
            
            particleMaterial.uniforms.time.value = time;
            
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                velocityArray[i3] += (Math.random() - 0.5) * 0.001;
                velocityArray[i3 + 1] += (Math.random() - 0.5) * 0.001;
                velocityArray[i3 + 2] += (Math.random() - 0.5) * 0.001;
                
                const speed = Math.sqrt(
                    velocityArray[i3] * velocityArray[i3] +
                    velocityArray[i3 + 1] * velocityArray[i3 + 1] +
                    velocityArray[i3 + 2] * velocityArray[i3 + 2]
                );
                
                if (speed > 0.1) {
                    velocityArray[i3] *= 0.99;
                    velocityArray[i3 + 1] *= 0.99;
                    velocityArray[i3 + 2] *= 0.99;
                }
                
                const pos = particles.geometry.attributes.position.array;
                pos[i3] += velocityArray[i3];
                pos[i3 + 1] += velocityArray[i3 + 1];
                pos[i3 + 2] += velocityArray[i3 + 2];
                
                if (pos[i3] < -25) velocityArray[i3] = 0.05;
                if (pos[i3] > 25) velocityArray[i3] = -0.05;
                if (pos[i3 + 1] < -25) velocityArray[i3 + 1] = 0.05;
                if (pos[i3 + 1] > 25) velocityArray[i3 + 1] = -0.05;
                if (pos[i3 + 2] < -25) velocityArray[i3 + 2] = 0.05;
                if (pos[i3 + 2] > 25) velocityArray[i3 + 2] = -0.05;
                
                particles.geometry.attributes.position.needsUpdate = true;
            }
            
            document.getElementById('stats').textContent = 
                'FPS: ' + Math.round(1 / (delta || 0.016)) + '\n' +
                'Particles: ' + particleCount + '\n' +
                'Life Energy: ' + Math.round(clock.elapsedTime).toString();
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            particleMaterial.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
        
        animate();
    </script>
</body>
</html>
