<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Shatter</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const vsSource = `
attribute vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

const fsSource = `
precision mediump float;

uniform float uTime;
uniform vec2 uRes;
uniform vec2 uMouse;

#define PI 3.14159265359
#define MAX_STEPS 18
#define MAX_DIST 50.0
#define SURF_DIST 0.01

// --- Noise utilities ---
mat2 rot2(float a) {
  float s = sin(a), c = cos(a);
  return mat2(c, -s, s, c);
}

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float hash2(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 r = rot2(0.5);
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = r * p * 2.0 + vec2(100.0);
    a *= 0.5;
  }
  return v;
}

// --- Voronoi ---
vec2 voronoi(vec2 p, out vec2 closestIdx) {
  vec2 n = floor(p);
  vec2 f = fract(p);
  float md = 8.0;
  vec2 mc = vec2(0.0);
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(float(x), float(y));
      vec2 o = n + g;
      vec2 r = o - f + vec2(hash(o + 0.1), hash2(o + 0.3));
      float d = length(r);
      if (d < md) {
        md = d;
        mc = o;
      }
    }
  }
  closestIdx = mc;
  return vec2(md, hash(mc + 0.7));
}

vec3 palette(float t) {
  // Fuzzy analog crystal palette - deep blues, frost whites, warm amber cracks
  vec3 a = vec3(0.5, 0.5, 0.5);
  vec3 b = vec3(0.5, 0.5, 0.5);
  vec3 c = vec3(1.0, 1.0, 1.0);
  vec3 d = vec3(0.263, 0.416, 0.557);
  return a + b * cos(6.28318 * (c * t + d));
}

vec3 palette2(float t) {
  // Warm crack / fracture glow
  return vec3(
    0.8 + 0.2 * sin(t * 3.14),
    0.4 + 0.3 * sin(t * 2.5 + 1.0),
    0.15 + 0.2 * sin(t * 4.0 + 2.0)
  );
}

// --- Shatter factor based on time zones ---
float shatterZone(vec2 uv, float t) {
  // Multiple shatter waves
  float wave1 = sin(t * 0.3 + uv.x * 2.0 + uv.y * 1.5);
  float wave2 = sin(t * 0.2 - uv.y * 3.0 + uv.x * 2.5);
  float zone = smoothstep(0.0, 0.8, wave1) * smoothstep(0.0, 0.8, wave2);
  return zone;
}

// --- Crack lines ---
float cracks(vec2 uv, vec2 idx, float shatter, float t) {
  // Voronoi edges
  vec2 n = floor(uv);
  vec2 f = fract(uv);
  float d1 = 8.0, d2 = 8.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(float(x), float(y));
      vec2 o = n + g;
      vec2 r = o - f + vec2(hash(o + 0.1), hash2(o + 0.3));
      float d = length(r - f);
      if (d < d1) { d2 = d1; d1 = d; }
      else if (d < d2) { d2 = d; }
    }
  }

  float edge = d2 - d1;
  float line = 1.0 - smoothstep(0.0, 0.04, edge);

  // Crack propagation from shatter zones
  float crackNoise = fbm(uv * 8.0 + t * 0.5);
  float crackLine = smoothstep(0.48, 0.52, crackNoise) * smoothstep(0.3, 0.7, shatter);

  // Jagged fracture lines
  float fracture = sin(uv.x * 40.0 + uv.y * 30.0 + t * 2.0) * 0.5 + 0.5;
  fracture *= smoothstep(0.02, 0.0, edge) * shatter;

  return max(max(line * 0.7, crackLine), fracture * 0.5);
}

// --- Crystal facets ---
float crystalFacet(vec2 uv, vec2 idx, float t) {
  vec2 n = floor(uv);
  vec2 f = fract(uv);
  vec2 o = n + vec2(hash(idx + 0.1), hash2(idx + 0.3));
  return length(f - o);
}

// --- Film grain ---
float filmGrain(vec2 uv, float t) {
  float grain = hash2(uv * 500.0 + floor(t * 60.0));
  return (grain - 0.5) * 0.08;
}

// --- Chromatic aberration / analog blur ---
vec3 analogBlur(sampler2D tex, vec2 uv, float amount) {
  vec2 texelSize = 1.0 / uRes;
  vec3 color = vec3(0.0);
  color += texture2D(tex, uv + vec2(-2.0, -1.0) * texelSize * amount).rgb * 0.5;
  color += texture2D(tex, uv + vec2(2.0, 1.0) * texelSize * amount).rgb * 0.5;
  return color;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  p.x *= uRes.x / uRes.y;

  float t = uTime;

  // Slow organic camera drift
  float camX = sin(t * 0.08) * 0.15 + uMouse.x * 0.1;
  float camY = cos(t * 0.06) * 0.1 + uMouse.y * 0.1;
  p += vec2(camX, camY);

  // Voronoi domain warping for organic crystal shapes
  vec2 q = vec2(
    fbm(p + vec2(0.0, 0.0) + t * 0.05),
    fbm(p + vec2(5.2, 1.3) + t * 0.03)
  );

  vec2 r = vec2(
    fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.04),
    fbm(p + 4.0 * q + vec2(8.3, 2.8) + t * 0.06)
  );

  float f = fbm(p + 4.0 * r);

  // Voronoi cells
  vec2 idx;
  vec2 v = voronoi(p * 3.0 + t * 0.02, idx);
  float dist = v.x;
  float cellId = v.y;

  // Shatter intensity per zone
  float shatter = shatterZone(p, t);

  // Shatter displacement - crystals breaking apart
  vec2 shatterDisp = vec2(0.0);
  float shatterTime = fract(t * 0.1);
  if (shatterTime < 0.7) {
    float s = smoothstep(0.0, 0.3, shatterTime) * smoothstep(0.7, 0.5, shatterTime);
    shatterDisp = vec2(
      sin(idx.x * 3.7 + t) * s * shatter * 0.3,
      cos(idx.y * 2.3 + t * 0.7) * s * shatter * 0.3
    );
  }

  vec2 suv = p * 3.0 + t * 0.02 + shatterDisp;
  vec2 sidx;
  vec2 sv = voronoi(suv, sidx);

  // Crystal body color
  float crystalF = fbm(p * 2.0 + t * 0.02);
  vec3 crystalColor = palette(crystalF + cellId * 0.3 + t * 0.02);

  // Frost / ice translucency
  float frost = smoothstep(0.3, 0.7, fbm(p * 6.0 + t * 0.03));
  crystalColor = mix(crystalColor, vec3(0.85, 0.9, 0.95), frost * 0.4);

  // Inner crystal glow
  float glow = exp(-dist * 6.0) * 0.6;
  crystalColor += vec3(0.3, 0.5, 0.7) * glow;

  // Cracks
  float crack = cracks(p, idx, shatter, t);

  // Crack glow - warm fracture light
  vec3 crackColor = palette2(crack + t * 0.1);
  crackColor *= smoothstep(0.0, 0.5, shatter) * 1.5;

  // Shatter particles - tiny crystal fragments
  float particles = 0.0;
  float shatterPhase = fract(t * 0.15);
  if (shatterPhase > 0.1 && shatterPhase < 0.8) {
    float pIntensity = smoothstep(0.1, 0.2, shatterPhase) * smoothstep(0.8, 0.6, shatterPhase);
    for (int i = 0; i < 8; i++) {
      vec2 pi = vec2(hash(vec2(float(i), idx.x)), hash2(vec2(float(i), idx.y)));
      vec2 particlePos = mix(p * 3.0, p * 3.0 + (pi - 0.5) * 2.0, pIntensity * shatter);
      float pd = length(gl_FragCoord.xy - particlePos * uRes * 0.15);
      particles += smoothstep(3.0, 0.0, pd) * pIntensity * 0.15;
    }
  }

  // Compose
  vec3 col = crystalColor;
  col += crackColor * crack;
  col += vec3(1.0, 0.7, 0.4) * particles;

  // Dark background between crystals
  float bgMask = smoothstep(0.02, 0.0, dist);
  col = mix(col, vec3(0.02, 0.02, 0.04), bgMask * 0.8);

  // Edge darkening (vignette)
  float vignette = 1.0 - length(uv - 0.5) * 0.8;
  col *= vignette;

  // Film grain
  col += vec3(filmGrain(gl_FragCoord.xy, t));

  // Analog warmth / color grading
  col = pow(col, vec3(0.95, 0.9, 1.0));

  // Slight blue shadow boost
  col *= vec3(0.95, 1.0, 1.05);

  // Scanlines (very subtle)
  col *= vec3(0.97 + 0.03 * sin(gl_FragCoord.y * 1.5));

  // Soft bloom on bright areas
  float bright = max(col.r, max(col.g, col.b));
  col += vec3(0.02) * bright * bright;

  // Tone mapping
  col = col / (col + 0.5);

  // Final contrast
  col = pow(col, vec3(0.92));

  // Fade in
  col *= smoothstep(0.0, 1.0, t);

  gl_FragColor = vec4(col, 1.0);
}
`;

function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}

const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);

const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
}

gl.useProgram(program);

const verts = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(program, 'uTime');
const uRes = gl.getUniformLocation(program, 'uRes');
const uMouse = gl.getUniformLocation(program, 'uMouse');

let mouseX = 0.5, mouseY = 0.5;
document.addEventListener('mousemove', e => {
  mouseX = e.clientX / window.innerWidth;
  mouseY = 1.0 - e.clientY / window.innerHeight;
});

const startTime = performance.now();

function render() {
  const t = (performance.now() - startTime) / 1000;
  gl.uniform1f(uTime, t);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform2f(uMouse, mouseX, mouseY);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
