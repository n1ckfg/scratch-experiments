<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lissajous Gooey Blobs - WebGL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
    camera.position.z = 1;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);

    // Fullscreen quad
    const geometry = new THREE.PlaneGeometry(2, 2);
    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
        }
    `;
    const fragmentShader = `
        uniform vec2 uResolution;
        uniform float uTime;

        // Metaball parameters
        const int blobCount = 5;
        struct Blob {
            vec2 center;
            float amplitudeX;
            float amplitudeY;
            float freqX;
            float freqY;
            float phase;
            vec3 color;
        };

        Blob blobs[blobCount];

        void initBlobs() {
            // Initialize blob parameters (different for each blob)
            for (int i = 0; i < blobCount; i++) {
                float seed = float(i);
                blobs[i].amplitudeX = 0.3 + 0.2 * sin(seed * 12.9898);
                blobs[i].amplitudeY = 0.25 + 0.15 * cos(seed * 78.233);
                blobs[i].freqX = 1.0 + sin(seed * 4.3758);
                blobs[i].freqY = 1.3 + cos(seed * 4.761);
                blobs[i].phase = seed * 6.2831 / 5.0;
                // Colors: hue spread
                float hue = seed / float(blobCount);
                blobs[i].color = vec3(
                    sin(6.2831 * (hue + 0.0)),
                    sin(6.2831 * (hue + 0.33)),
                    sin(6.2831 * (hue + 0.66))
                ) * 0.8 + 0.2;
            }
        }

        void updateBlobs(float time) {
            for (int i = 0; i < blobCount; i++) {
                Blob b = blobs[i];
                float t = time * 0.3 + b.phase;
                float x = sin(t * b.freqX) * b.amplitudeX;
                float y = sin(t * b.freqY) * b.amplitudeY;
                blobs[i].center = vec2(x, y);
            }
        }

        float metaball(vec2 pt, Blob b) {
            float d = distance(pt, b.center);
            // Avoid division by zero
            return 0.008 / (d * d + 0.0001);
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / uResolution.xy;
            uv = uv * 2.0 - 1.0; // Normalize to [-1, 1]
            // Adjust aspect ratio
            uv.x *= uResolution.x / uResolution.y;

            initBlobs();
            updateBlobs(uTime);

            float field = 0.0;
            vec3 colorSum = vec3(0.0);
            for (int i = 0; i < blobCount; i++) {
                float m = metaball(uv, blobs[i]);
                field += m;
                colorSum += blobs[i].color * m;
            }

            // Normalize color by field
            vec3 color = colorSum / max(field, 0.0001);

            // Melting effect: over time increase merge and darken
            float melt = smoothstep(0.0, 12.0, uTime); // Melts over 12 seconds
            float threshold = 0.3 + melt * 0.4; // Increase threshold to merge more
            float mask = smoothstep(threshold - 0.05, threshold + 0.05, field);

            // Dark glass color: dark blue with slight transparency effect
            vec3 glassColor = vec3(0.0, 0.0, 0.15);
            // Mix between original color and glass based on mask and melt
            color = mix(color, glassColor, melt * 0.7);
            // Apply mask to shape the blobs
            color *= mask;

            // Add a slight glow/glass specular based on field
            float spec = pow(field * 8.0, 2.0);
            color += vec3(0.2, 0.25, 0.3) * spec * 0.3 * melt;

            // Vignette
            float vignette = smoothstep(0.8, 0.5, distance(uv, vec2(0.0)));
            color *= vignette;

            gl_FragColor = vec4(color, 1.0);
        }
    `;
    const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        uniforms: {
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            uTime: { value: 0 }
        }
    });
    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    // Clock
    const clock = new THREE.Clock();

    // Resize handler
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.left = -w / h;
        camera.right = w / h;
        camera.top = 1;
        camera.bottom = -1;
        camera.updateProjectionMatrix();
        material.uniforms.uResolution.value.set(w, h);
    });

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();
        material.uniforms.uTime.value = elapsed;
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
