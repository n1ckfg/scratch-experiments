<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fooz2</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');
const RES_SCALE = 0.5;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(innerWidth * dpr * RES_SCALE), h = Math.floor(innerHeight * dpr * RES_SCALE);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
addEventListener('resize', resize);
resize();

const vsSrc = `
attribute vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }
`;

const fsSrc = `
precision highp float;
uniform vec2 res;
uniform float time;

#define TAU 6.28318530718
#define MAX_STEPS 45
#define SURF 0.002
#define PGRID 14

float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

vec3 hash3(vec2 p) {
  vec3 q = vec3(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)), dot(p, vec2(419.2, 371.9)));
  return fract(q * vec3(43758.5453, 22578.145, 11345.42));
}

// explosion pulse: 0 most of the time, spikes periodically
float explode(float t) {
  float ph = fract(t * 0.11);
  return smoothstep(0.55, 0.75, ph) * (1.0 - smoothstep(0.78, 1.0, ph));
}

// coil center path
vec2 coilPath(float y, float t, float e) {
  float turns = 5.0 * (1.0 + e * 0.6);
  float height = 6.0 * (1.0 + e * 0.35);
  float ang = y * turns * TAU / height + t * 0.8;
  return vec2(cos(ang), sin(ang)) * (1.1 + e * 0.5);
}

// wriggling coiled liquid tube
float sdCoil(vec3 p, float t, float e) {

  // wriggle the whole coil
  p.x += sin(t * 0.7 + p.y * 0.6) * 0.35;
  p.z += cos(t * 0.9 + p.x * 0.5) * 0.35;
  float bend = sin(t * 0.4) * 0.5;
  p.x += bend * p.y * 0.35;
  p.z += cos(t * 0.3) * 0.4 * p.y * 0.35;

  vec2 c = coilPath(p.y, t, e);
  vec2 d = p.xz - c;
  float ang2 = atan(d.y, d.x);

  // twisted, bulbing cross-section
  float twist = p.y * 3.0 + t * 1.5;
  float r = 0.28 + 0.12 * sin(ang2 * 3.0 + twist) + 0.08 * sin(ang2 * 5.0 - twist * 1.7);
  r += 0.06 * sin(p.y * 9.0 - t * 3.0);

  if (e > 0.01) {
    float s = p.y * 5.0 * TAU / 6.0;
    r *= 1.0 + e * 1.3 * sin(s * 12.0 + t * 5.0);
    r *= 1.0 + e * 0.9;
  }

  return length(d) - r;
}

// blobs that fly off during the explosion
float sdBlobs(vec3 p, float t, float e) {
  if (e < 0.01) return 10.0;
  float m = 10.0;
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    vec3 dir = normalize(vec3(sin(fi * 2.4 + 1.0), cos(fi * 1.7), sin(fi * 1.3 + 2.0)));
    vec3 bp = dir * e * 3.2;
    m = min(m, length(p - bp) - 0.12 * e);
  }
  return m;
}

float map(vec3 p, float t, float e) {
  float dc = sdCoil(p, t, e);
  if (e < 0.01) return dc;
  return smin(dc, sdBlobs(p, t, e), 0.35 * (1.0 - e * 0.5));
}

vec3 calcNormal(vec3 p, float t, float ex) {
  vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(
    map(p - e.xyy, t, ex) - map(p + e.xyy, t, ex),
    map(p - e.yxy, t, ex) - map(p + e.yxy, t, ex),
    map(p - e.yyx, t, ex) - map(p + e.yyx, t, ex)
  ));
}

float softShadow(vec3 ro, vec3 rd, float t, float e) {
  float res = 1.0, d = 0.02;
  for (int i = 0; i < 12; i++) {
    float h = map(ro + rd * d, t, e);
    res = min(res, 9.0 * h / d);
    d += max(h, 0.01);
    if (res < 0.005 || d > 4.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float calcAO(vec3 p, vec3 n, float t, float e) {
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++) {
    float h = 0.02 + 0.11 * float(i) / 4.0;
    occ += (h - map(p + n * h, t, e)) * sca;
    sca *= 0.85;
  }
  return clamp(1.0 - 2.0 * occ, 0.0, 1.0);
}

// deep greens with glowing orange highlights
vec3 palette(float f) {
  float c = fract(f);
  vec3 deep   = vec3(0.012, 0.07, 0.04);
  vec3 green  = vec3(0.10, 0.62, 0.26);
  vec3 orange = vec3(1.0, 0.48, 0.10);
  float g = 0.5 + 0.5 * cos(TAU * c * 2.0 + 0.9);
  float o = 0.5 + 0.5 * cos(TAU * c * 3.0 + 2.6);
  o = o * o;
  return mix(mix(deep, green, g), orange, o);
}

// ---- forked lightning (screen space, unrolled midpoint displacement) ----
float hash1(float n){ return fract(sin(n) * 43758.5453123); }

float segDist(vec2 uv, vec2 a, vec2 b) {
  vec2 pa = uv - a, ba = b - a;
  float c = clamp(dot(pa, ba), 0.0, max(dot(ba, ba), 1e-6));
  return length(pa - ba * (c / max(dot(ba, ba), 1e-6)));
}

vec2 boltMid(vec2 a, vec2 b, float seed) {
  float l = length(b - a);
  vec2 nrm = (b - a) / max(l, 1e-5);
  return 0.5 * (a + b) + vec2(-nrm.y, nrm.x) * (hash1(seed) * 2.0 - 1.0) * 0.28 * l;
}

// 3 split levels -> 8 jagged segments, with per-level broadphase pruning
float boltDist(vec2 uv, vec2 a, vec2 b, float seed) {
  float l = length(b - a);
  if (l < 1e-4) return 10.0;
  float d = segDist(uv, a, b);
  if (d - 0.62 * l > 0.05) return d;
  float L1 = seed * 1.617 + 7.31, R1 = seed * 2.173 + 3.7;
  vec2 m1 = boltMid(a, b, seed);
  float d1a = segDist(uv, a, m1), d1b = segDist(uv, m1, b);
  d = min(d, min(d1a, d1b));
  if (min(d1a, d1b) - 0.31 * l > 0.05) return d;
  float L2 = L1 * 1.617 + 7.31, L3 = L1 * 2.173 + 3.7;
  float R2 = R1 * 1.617 + 7.31, R3 = R1 * 2.173 + 3.7;
  vec2 m2 = boltMid(a, m1, L1), m3 = boltMid(m1, b, R1);
  float d2a = segDist(uv, a, m2), d2b = segDist(uv, m2, m1);
  float d2c = segDist(uv, m1, m3), d2d = segDist(uv, m3, b);
  d = min(d, min(min(d2a, d2b), min(d2c, d2d)));
  if (d - 0.155 * l > 0.05) return d;
  vec2 m4 = boltMid(a, m2, L2), m5 = boltMid(m2, m1, L3);
  vec2 m6 = boltMid(m1, m3, R2), m7 = boltMid(m3, b, R3);
  d = min(d, min(min(segDist(uv, a, m4), segDist(uv, m4, m2)),
               min(segDist(uv, m2, m5), segDist(uv, m5, m1))));
  d = min(d, min(min(segDist(uv, m1, m6), segDist(uv, m6, m3)),
               min(segDist(uv, m3, m7), segDist(uv, m7, b))));
  return d;
}

// 2 split levels -> 4 segments, for the forks
float forkDist(vec2 uv, vec2 a, vec2 b, float seed) {
  float l = length(b - a);
  if (l < 1e-4) return 10.0;
  float d = segDist(uv, a, b);
  if (d - 0.62 * l > 0.04) return d;
  float L1 = seed * 1.617 + 7.31, R1 = seed * 2.173 + 3.7;
  vec2 m1 = boltMid(a, b, seed);
  float d1a = segDist(uv, a, m1), d1b = segDist(uv, m1, b);
  d = min(d, min(d1a, d1b));
  if (min(d1a, d1b) - 0.31 * l > 0.04) return d;
  vec2 m2 = boltMid(a, m1, L1), m3 = boltMid(m1, b, R1);
  d = min(d, min(min(segDist(uv, a, m2), segDist(uv, m2, m1)),
               min(segDist(uv, m1, m3), segDist(uv, m3, b))));
  return d;
}

vec2 boltAt(vec2 a, vec2 b, float u, float seed) {
  float l = length(b - a);
  vec2 nrm = (b - a) / max(l, 1e-5);
  vec2 m = 0.5 * (a + b) + vec2(-nrm.y, nrm.x) * (hash1(seed) * 2.0 - 1.0) * 0.28 * l;
  if (u < 0.5) return mix(a, m, u * 2.0);
  return mix(m, b, (u - 0.5) * 2.0);
}

vec3 boltLight(vec2 uv, vec2 a, vec2 b, float seed) {
  float l = length(b - a);
  vec2 pa = uv - a, ba = b - a;
  float ca = clamp(dot(pa, ba), 0.0, max(dot(ba, ba), 1e-6));
  if (length(pa - ba * (ca / max(dot(ba, ba), 1e-6))) - 0.62 * l > 0.1) return vec3(0.0);
  float d = boltDist(uv, a, b, seed);
  vec3 c = exp(-d * 26.0) * vec3(1.0, 0.45, 0.10) * 0.6
         + exp(-d * 70.0) * vec3(1.0, 0.95, 0.85);
  vec2 dir = ba / max(l, 1e-5);
  vec2 nrm = vec2(-dir.y, dir.x);
  for (int k = 0; k < 3; k++) {
    float u0 = 0.3 + 0.6 * hash1(seed * 3.1 + float(k) * 17.3);
    vec2 fa = boltAt(a, b, u0, seed);
    float sgn = hash1(seed * 5.0 + float(k) * 13.0) * 2.0 - 1.0;
    float lf = (0.3 + 0.45 * hash1(seed * 7.7 + float(k) * 3.1)) * l;
    vec2 fb = fa + (nrm * sgn * 1.2 + dir * 0.5) * lf;
    float df = forkDist(uv, fa, fb, seed + 41.0 + float(k) * 17.0);
    c += exp(-df * 26.0) * vec3(1.0, 0.45, 0.1) * 0.25
       + exp(-df * 70.0) * vec3(1.0, 0.9, 0.8) * 0.5;
  }
  return c;
}

// ---- sdf-based particle system ----
// stateless: each particle's position is a pure function of (index, time)
vec3 particles(vec3 p, float t, float e, out float glow) {
  glow = 0.0;
  vec3 acc = vec3(0.0);
  float coilK = 5.0 * (1.0 + e * 0.6) * TAU / (6.0 * (1.0 + e * 0.35));
  float coilPhase = t * 0.8;
  float coilScale = 1.1 + e * 0.5;
  for (int j = 0; j <= PGRID; j++) {
    for (int i = 0; i <= PGRID; i++) {
      vec2 id = vec2(float(i), float(j));
      vec3 h = hash3(id);
      float y = (h.y - 0.5) * 6.0;
      float ang = y * coilK + coilPhase;
      vec2 c = vec2(cos(ang), sin(ang)) * coilScale;
      float a2 = h.z * TAU + t * (0.4 + h.x * 0.8);
      float rad = 0.45 + 0.3 * h.x + e * (0.8 + 2.2 * h.y);
      vec3 pos = vec3(c.x + cos(a2) * rad, y + 0.15 * sin(a2 * 2.0 + t), c.y + sin(a2) * rad);
      float d2 = dot(p - pos, p - pos);
      if (d2 > 0.15) continue;
      float g = exp(-d2 * 30.0);
      glow += g;
      acc += g * palette(h.z + t * 0.05 + e * 0.2);
    }
  }
  return acc;
}

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - res) / res.y;
  float t = time;
  float e = explode(t);

  float ca = t * 0.25;
  vec3 ro = vec3(2.8 * sin(ca), 0.6 * sin(t * 0.3), 2.8 * cos(ca));
  vec3 fw = normalize(-ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw * 1.6 + uv.x * rt + uv.y * up);

  // raymarch the coil
  float dist = 0.0, d = 0.0;
  vec3 p = ro;
  bool hit = false;
  for (int i = 0; i < MAX_STEPS; i++) {
    p = ro + rd * dist;
    d = map(p, t, e);
    if (d < SURF || dist > 12.0) { hit = d < SURF; break; }
    dist += d * 0.9;
  }

  vec3 bg = mix(vec3(0.008, 0.028, 0.014), vec3(0.018, 0.05, 0.026), uv.y * 0.5 + 0.5);
  bg += vec3(0.05, 0.018, 0.004) * smoothstep(0.25, -0.7, uv.y) * (0.4 + e * 1.5);
  vec3 col = bg;

  if (hit) {
    vec3 n = calcNormal(p, t, e);
    vec3 lig = normalize(vec3(0.6, 0.8, -0.4));
    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float sh = softShadow(p + n * 0.02, lig, t, e);
    float ao = calcAO(p, n, t, e);
    float fre = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 3.0);
    float spe = pow(clamp(dot(reflect(rd, n), lig), 0.0, 1.0), 24.0);

    float f = p.y * 0.15 + dot(n, vec3(0.0, 1.0, 0.0)) * 0.3 + t * 0.05 + e * 0.4;
    vec3 base = palette(f);

    col = base * (0.15 + 0.85 * dif * sh) * ao;
    col += fre * palette(f + 0.3) * (0.8 + e);
    col += spe * 0.6 * vec3(1.0, 0.6, 0.25);
    col += pow(clamp(dot(-rd, -lig), 0.0, 1.0), 3.0) * base * 0.25 * ao;
  }

  // particles (behind and in front of the coil both glow)
  float glow;
  vec3 pcol = particles(ro + rd * 1.5, t, e, glow);
  col += pcol * 0.012 * (1.0 + e * 2.0);
  col += glow * glow * 0.004 * vec3(0.35, 0.8, 0.45);

  // forked lightning during explosions
  if (e > 0.2) {
    float inten = smoothstep(0.2, 0.5, e) * (0.6 + 0.4 * fract(t * 11.0));
    for (int k = 0; k < 3; k++) {
      float sk = floor(t * 1.2) * 57.31 + float(k) * 91.7;
      float yA = (hash1(sk + 1.7) - 0.5) * 5.0;
      vec2 cA = coilPath(yA, t, e);
      vec2 nA = length(cA) > 0.001 ? cA / length(cA) : vec2(1.0, 0.0);
      vec3 wA = vec3(cA.x + nA.x * 0.6, yA, cA.y + nA.y * 0.6);
      vec3 v = wA - ro;
      float vz = dot(v, fw);
      if (vz < 0.1) continue;
      vec2 sA = vec2(dot(v, rt), dot(v, up)) / vz;
      vec2 sB = sA + vec2((hash1(sk + 2.3) - 0.5) * 1.7, 0.6 + hash1(sk + 3.1) * 1.2);
      col += boltLight(uv, sA, sB, sk) * inten;
    }
  }

  // flash on explosion
  col += e * e * 0.15 * vec3(1.0, 0.5, 0.15);

  col *= 1.0 - 0.25 * dot(uv, uv);
  col = pow(col, vec3(0.4545));
  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'res');
const uTime = gl.getUniformLocation(prog, 'time');

function frame(now) {
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, now * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
