<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>fooz3</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

const VS = `
attribute vec2 a;
void main() { gl_Position = vec4(a, 0.0, 1.0); }
`;

const FS = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
#define TAU 6.28318530718

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash12(i);
  float b = hash12(i + vec2(1.0, 0.0));
  float c = hash12(i + vec2(0.0, 1.0));
  float d = hash12(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

mat2 rot(float a) {
  float c = cos(a), s = sin(a);
  return mat2(c, -s, s, c);
}

// spiky star: n sharp points
float sdStar(vec2 p, float r, float n) {
  float a = atan(p.y, p.x);
  float rr = r * (0.30 + 0.70 * abs(cos(n * a * 0.5)));
  return length(p) - rr;
}

// broken spiky shape: star with notches carved out
float sdBroken(vec2 p, float r, float n, float seed) {
  float d = sdStar(p, r, n);
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float ang = hash12(vec2(seed, fi)) * TAU;
    float rad = r * (0.2 + 0.5 * hash12(vec2(seed + 7.0, fi)));
    float cr  = r * (0.15 + 0.25 * hash12(vec2(seed + 13.0, fi)));
    vec2 c = vec2(cos(ang), sin(ang)) * rad;
    d = max(d, cr - length(p - c));
  }
  return d;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  float t = u_time;

  float cell = 0.42;
  vec2 id = floor(uv / cell);
  vec2 gv = uv - (id + 0.5) * cell;

  float seed  = hash12(id);
  float seed2 = hash12(id + 31.7);
  float seed3 = hash12(id + 57.3);
  float ph = seed * TAU;

  // wriggle: center drifts around inside its cell
  vec2 center = vec2(
    sin(t * (0.4 + seed2) + ph),
    cos(t * (0.3 + seed3 * 0.7) + ph * 1.7)
  ) * cell * 0.35;

  vec2 p = gv - center;

  // melt cycle per particle
  float melt = 0.5 + 0.5 * sin(t * (0.15 + seed2 * 0.3) + ph * 3.0);
  melt = melt * melt;

  // melt: horizontal sway that grows with height
  p.x += sin(p.y * 9.0 - t * 2.0 + ph) * melt * 0.12;
  // stretch into a drip
  p.y /= (1.0 + melt * 1.6);
  // sag downward
  p.y += melt * 0.10;

  // twist: rotation proportional to height
  float tw = (0.6 + seed3 * 1.2) * sin(t * 0.4 + ph) * (0.5 + melt);
  p = rot(tw * p.y * 3.0) * p;

  // wriggle spin
  float spin = t * (seed2 - 0.5) * 1.5 + sin(t * (1.0 + seed3) + ph) * 0.8;
  p = rot(spin) * p;

  float r = cell * (0.16 + 0.10 * seed);
  float spikes = 4.0 + floor(seed2 * 5.0);
  float d = sdBroken(p, r, spikes, seed * 100.0);

  float hue = fract(seed3 + t * 0.03);
  vec3 col = 0.5 + 0.5 * cos(TAU * (hue + vec3(0.0, 0.33, 0.67)));
  col *= 0.7 + 0.3 * melt;

  float aa = 1.5 / u_res.y;
  float body = 1.0 - smoothstep(-aa, aa, d);
  float glow = pow(0.004 / (abs(d) + 0.004), 1.5) * 0.35;

  vec3 bg = vec3(0.02, 0.02, 0.04) + 0.02 * vnoise(uv * 3.0 + t * 0.05);
  vec3 c = bg + col * (body * 1.2 + glow);

  c *= 1.0 - 0.35 * dot(uv, uv);

  gl_FragColor = vec4(c, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

const t0 = performance.now();
function frame() {
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, (performance.now() - t0) / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
