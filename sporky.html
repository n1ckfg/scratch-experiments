<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; gl.viewport(0, 0, canvas.width, canvas.height); }
window.addEventListener('resize', resize); resize();

const vsSource = `#version 300 es
in vec4 a_position;
void main() { gl_Position = a_position; }`;

const fsSource = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 u_res;
uniform float u_time;

#define PI 3.14159265359
#define MAX_STEPS 120
#define MAX_DIST 50.0
#define SURF_DIST 0.001

// ---- Hash & Noise ----
mat2 rot2(float a) { float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

float hash(float n) { return fract(sin(n)*43758.5453); }
float hash2(vec2 p) { return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

float noise(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    f = f*f*(3.0-2.0*f);
    float n = i.x + i.y*157.0 + 289.0*i.z;
    float a = hash(n);
    float b = hash(n+1.0);
    float c = hash(n+157.0);
    float d = hash(n+289.0);
    return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(hash(n+158.0),hash(n+289.0+1.0),f.x),mix(hash(n+446.0),hash(n+735.0),f.x),f.y),f.z);
}

float fbm(vec3 p) {
    float v=0.0, a=0.5;
    for(int i=0; i<6; i++) { v+=a*noise(p); p=p*2.0+vec3(0.13,0.27,0.05); a*=0.5; }
    return v;
}

// ---- SDF Primitives ----
float sdSphere(vec3 p, float r) { return length(p)-r; }

float sdCylinder(vec3 p, float r, float h) {
    vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h);
    return min(max(d.x,d.y), 0.0) + length(max(d, 0.0));
}

float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
    vec3 pa = p-a, ba = b-a;
    float h = clamp(dot(pa,ba)/dot(ba,ba), 0.0, 1.0);
    return length(pa-ba*h)-r;
}

float sdTwistedCapsule(vec3 p, vec3 a, vec3 b, float r, float twist, float segments) {
    vec3 pa = p-a, ba = b-a;
    float h = clamp(dot(pa,ba)/dot(ba,ba), 0.0, 1.0);
    vec3 linePt = a + ba*h;
    float t = length(p-linePt);
    float angle = h*twist;
    float segAngle = floor(h*segments)*PI*2.0/segments;
    mat2 ts = rot2(angle + segAngle);
    vec3 dp = p;
    dp.xz = ts * dp.xz;
    linePt.xz = ts * linePt.xz;
    float segT = length(dp-linePt);
    float thicknessMod = 1.0 + 0.3*sin(h*8.0 + u_time*2.0);
    return segT - r*thicknessMod;
}

// ---- Snake SDF ----
vec2 opUnion(vec2 a, vec2 b) { return min(a,b); }

float snakeBody(vec3 p, float t) {
    // Snake follows a Lissajous-like 3D path
    float pathT = t;
    float x = sin(pathT*1.8)*2.5 + sin(pathT*0.7)*1.2;
    float y = sin(pathT*2.3 + 1.0)*0.8 + 0.5;
    float z = cos(pathT*1.5)*2.5 + cos(pathT*0.9)*1.0;
    vec3 pathPt = vec3(x, y, z);
    
    vec3 pa = p - pathPt;
    float dist = length(pa);
    
    // Add undulation
    float undulation = sin(pathT*12.0 + t*3.0)*0.15;
    dist += undulation;
    
    // Thickness variation
    float thickness = 0.45 + 0.12*sin(pathT*5.0 + t*2.0);
    
    // Head
    float headDist = length(p - pathPt) - thickness*1.8;
    
    // Body segments (subtle bumps for organic feel)
    float bumps = sin(pathT*20.0)*0.03;
    dist += bumps;
    
    return max(dist - thickness, headDist);
}

vec2 mapSnakeA(vec3 p, float t) {
    vec3 offset = vec3(sin(t*0.8)*2.0, 0.0, cos(t*0.6)*2.0);
    float s = snakeBody(p - offset, t);
    // Add head
    vec3 headPos = offset + vec3(sin(t*1.8)*2.5 + sin(t*0.7)*1.2, sin(t*2.3+1.0)*0.8+0.5, cos(t*1.5)*2.5+cos(t*0.9)*1.0);
    float head = sdSphere(p - headPos, 0.55);
    // Eyes
    vec3 eyeL = headPos + vec3(0.25, 0.15, 0.2);
    vec3 eyeR = headPos + vec3(0.25, 0.15, -0.2);
    float eye1 = sdSphere(p - eyeL, 0.08);
    float eye2 = sdSphere(p - eyeR, 0.08);
    float pupil1 = sdSphere(p - eyeL*1.0 - vec3(0.04,0,0), 0.04);
    float pupil2 = sdSphere(p - eyeR*1.0 - vec3(0.04,0,0), 0.04);
    
    vec2 res = vec2(s, 1.0);
    if(head < s) res = vec2(head, 2.0);
    if(eye1 < s) res = vec2(eye1, 3.0);
    if(eye2 < s) res = vec2(eye2, 3.0);
    if(pupil1 < eye1) res = vec2(pupil1, 4.0);
    if(pupil2 < eye2) res = vec2(pupil2, 4.0);
    return res;
}

vec2 mapSnakeB(vec3 p, float t) {
    vec3 offset = vec3(cos(t*0.8)*2.0, 0.0, sin(t*0.6)*2.0);
    float s = snakeBody(p - offset, t + PI);
    vec3 headPos = offset + vec3(sin((t+PI)*1.8)*2.5 + sin((t+PI)*0.7)*1.2, sin((t+PI)*2.3+1.0)*0.8+0.5, cos((t+PI)*1.5)*2.5+cos((t+PI)*0.9)*1.0);
    float head = sdSphere(p - headPos, 0.55);
    vec3 eyeL = headPos + vec3(0.25, 0.15, 0.2);
    vec3 eyeR = headPos + vec3(0.25, 0.15, -0.2);
    float eye1 = sdSphere(p - eyeL, 0.08);
    float eye2 = sdSphere(p - eyeR, 0.08);
    float pupil1 = sdSphere(p - eyeL - vec3(0.04,0,0), 0.04);
    float pupil2 = sdSphere(p - eyeR - vec3(0.04,0,0), 0.04);
    
    vec2 res = vec2(s, 1.0);
    if(head < s) res = vec2(head, 2.0);
    if(eye1 < s) res = vec2(eye1, 3.0);
    if(eye2 < s) res = vec2(eye2, 3.0);
    if(pupil1 < eye1) res = vec2(pupil1, 4.0);
    if(pupil2 < eye2) res = vec2(pupil2, 4.0);
    return res;
}

vec2 mapScene(vec3 p, float t) {
    // Swamp ground
    float ground = p.y - (-1.5 + sin(p.x*0.5+t*0.3)*0.3 + sin(p.z*0.7+t*0.2)*0.2);
    vec2 res = vec2(ground, 5.0);
    
    // Snake A
    vec2 sa = mapSnakeA(p, t);
    if(sa.x < res.x) res = sa;
    
    // Snake B
    vec2 sb = mapSnakeB(p, t);
    if(sb.x < res.x) res = sb;
    
    return res;
}

vec3 calcNormal(vec3 p, float t) {
    vec2 e = vec2(0.001, 0.0);
    float d = mapScene(p, t).x;
    return normalize(vec3(
        mapScene(p+e.xyy, t).x - d,
        mapScene(p+e.yxy, t).x - d,
        mapScene(p+e.yyx, t).x - d
    ));
}

vec4 getSnakeColor(vec3 p, vec3 n, vec3 rd, float t, float matId) {
    vec4 col = vec4(0.0);
    
    if(matId == 1.0) {
        // Swamp water
        float wave = sin(p.x*2.0+u_time)*0.1 + sin(p.z*3.0+u_time*0.7)*0.08;
        col = vec4(0.08+wave, 0.15+wave*0.5, 0.05, 1.0);
        float shimmer = sin(p.x*5.0+p.z*4.0+u_time*2.0)*0.5+0.5;
        col.rgb += vec3(0.05, 0.08, 0.02)*shimmer;
    }
    else if(matId == 2.0) {
        // Snake body - organic clay material
        float fresnel = pow(1.0 - abs(dot(n, rd)), 3.0);
        
        // Base color variation
        float pattern = sin(p.x*8.0+p.y*6.0+p.z*7.0)*0.5+0.5;
        vec3 baseColor1 = vec3(0.15, 0.35, 0.10); // dark green
        vec3 baseColor2 = vec3(0.25, 0.45, 0.15); // lighter green
        vec3 baseColor = mix(baseColor1, baseColor2, pattern);
        
        // Spots
        float spots = sin(p.x*12.0+p.y*10.0)*sin(p.z*11.0+p.y*9.0);
        spots = smoothstep(0.3, 0.7, spots)*0.3;
        baseColor += vec3(spots*0.15, spots*0.2, spots*0.05);
        
        // Clay subsurface-like lighting
        float sss = pow(max(0.0, dot(rd, -normalize(vec3(0.5, 1.0, 0.3)))), 0.5)*0.4;
        
        // Lighting
        vec3 lightDir1 = normalize(vec3(0.5, 1.0, 0.3));
        vec3 lightDir2 = normalize(vec3(-0.3, 0.5, -0.5));
        float diff1 = max(0.0, dot(n, lightDir1));
        float diff2 = max(0.0, dot(n, lightDir2))*0.3;
        float spec = pow(max(0.0, dot(n, normalize(lightDir1+rd))), 32.0)*0.3;
        
        col.rgb = baseColor*(diff1 + diff2 + sss) + vec3(0.02) + vec3(0.15,0.2,0.08)*spec;
        col.rgb += fresnel*vec3(0.05, 0.1, 0.03)*0.5;
        
        // Wet sheen
        col.rgb += fresnel*vec3(0.1, 0.15, 0.05);
    }
    else if(matId == 3.0) {
        // Eyes
        col.rgb = vec3(0.9, 0.85, 0.3);
        col.rgb += vec3(0.1);
    }
    else if(matId == 4.0) {
        // Pupils - vertical slits
        col.rgb = vec3(0.02, 0.02, 0.01);
    }
    
    return col;
}

vec3 rayMarch(vec3 ro, vec3 rd, float t) {
    float dist = 0.0;
    float matId = 0.0;
    
    for(int i=0; i<MAX_STEPS; i++) {
        vec3 p = ro + rd*dist;
        vec2 res = mapScene(p, t);
        float d = res.x;
        matId = res.y;
        
        if(d < SURF_DIST || dist > MAX_DIST) break;
        dist += d*0.85; // slightly understep for safety
    }
    
    if(dist > MAX_DIST) return vec3(0.02, 0.04, 0.01);
    
    vec3 p = ro + rd*dist;
    vec3 n = calcNormal(p, t);
    
    // Fog/ambient
    float fog = 1.0 - exp(-dist*0.08);
    vec3 fogCol = vec3(0.06, 0.1, 0.04);
    
    vec4 matCol = getSnakeColor(p, n, rd, t, matId);
    
    // Swamp gas particles
    float gas = fbm(p*0.8 + vec3(t*0.1, 0.0, t*0.05));
    gas = smoothstep(0.4, 0.8, gas)*0.3;
    matCol.rgb += vec3(0.08, 0.15, 0.04)*gas;
    
    // Fireflies
    vec3 ffPos = vec3(
        sin(t*0.7 + 1.0)*3.0,
        sin(t*1.3 + 2.0)*0.5 + 1.0,
        cos(t*0.5 + 3.0)*3.0
    );
    float ffDist = length(p - ffPos);
    float ff = smoothstep(0.15, 0.0, ffDist)*sin(t*5.0)*0.5+0.5;
    matCol.rgb += vec3(0.8, 1.0, 0.3)*ff*0.8;
    
    matCol.rgb = mix(matCol.rgb, fogCol, fog);
    
    return matCol.rgb;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
    float t = u_time;
    
    // Camera orbits slowly
    float camAngle = t*0.15;
    float camHeight = 3.5 + sin(t*0.2)*0.5;
    vec3 ro = vec3(sin(camAngle)*5.0, camHeight, cos(camAngle)*5.0);
    vec3 target = vec3(0.0, 0.0, 0.0);
    
    vec3 fwd = normalize(target - ro);
    vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
    vec3 up = cross(right, fwd);
    vec3 rd = normalize(fwd*1.5 + right*uv.x + up*uv.y);
    
    // Swamp background - murky water with foliage
    vec3 bgCol = rayMarch(ro, rd, t);
    
    // Post-processing
    // Vignette
    vec2 q = gl_FragCoord.xy / u_res;
    float vig = 1.0 - 0.4*length(q-0.5);
    bgCol *= vig;
    
    // Subtle film grain
    float grain = hash2(gl_FragCoord.xy + fract(t))*0.03;
    bgCol += grain - 0.015;
    
    // Color grading - swampy green cast
    bgCol = pow(bgCol, vec3(0.95, 1.0, 0.9));
    
    // Tone mapping
    bgCol = bgCol/(bgCol+0.8);
    
    // Slight chromatic aberration at edges
    float caStr = length(uv)*0.01;
    bgCol.r = bgCol.r*1.02;
    bgCol.b = bgCol.b*0.98;
    
    fragColor = vec4(bgCol, 1.0);
}`;

const vsSource2 = `attribute vec4 a_position;
void main() { gl_Position = a_position; }`;

const fsSource2 = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 u_res;
uniform float u_time;

#define PI 3.14159265359
#define MAX_STEPS 128
#define MAX_DIST 50.0
#define SURF_DIST 0.001

mat2 r2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash(float n){return fract(sin(n)*43758.5453);}
float hash2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec3 p){
    vec3 i=floor(p),f=fract(p);
    f=f*f*(3.0-2.0*f);
    float n=i.x+i.y*157.0+289.0*i.z;
    return mix(mix(mix(hash(n),hash(n+1.0),f.x),mix(hash(n+157.0),hash(n+289.0),f.x),f.y),
               mix(mix(hash(n+158.0),hash(n+289.0+1.0),f.x),mix(hash(n+446.0),hash(n+735.0),f.x),f.y),f.z);
}

float fbm(vec3 p){
    float v=0.0,a=0.5;
    for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.1+vec3(0.13,0.27,0.05);a*=0.5;}
    return v;
}

float sdSphere(vec3 p,float r){return length(p)-r;}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){
    vec3 pa=p-a,ba=b-a;
    float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
    return length(pa-ba*h)-r;
}

vec2 mapSnake(vec3 p,float t,float phase){
    // Lissajous fighting path
    float s=phase;
    vec3 pathPt;
    pathPt.x=sin(t*1.3+s*PI)*3.0+sin(t*0.6+s*2.0)*1.5;
    pathPt.y=sin(t*2.1+s*1.5)*1.2+0.3;
    pathPt.z=cos(t*1.1+s*PI)*3.0+cos(t*0.8+s)*1.3;
    
    vec3 pa=p-pathPt;
    float d=length(pa);
    
    // Undulating thickness
    float thickness=0.4+0.12*sin(t*3.0+s*PI)*0.5+0.15*sin(length(pa)*10.0+t*2.0);
    
    // Body segments
    float seg=sin(t*4.0+s*PI+length(pa)*8.0)*0.04;
    d+=seg;
    
    vec2 res=vec2(d-thickness,1.0);
    
    // Head
    float headD=length(p-pathPt)-thickness*2.0;
    if(headD<res.x) res=vec2(headD,2.0);
    
    // Eyes
    vec3 dir=vec3(cos(t*1.3+s*PI)*1.3,0,cos(t*1.1+s*PI)*1.1);
    dir=normalize(dir);
    vec3 eyeL=pathPt+dir*0.4+vec3(0,0.2,0.25);
    vec3 eyeR=pathPt+dir*0.4+vec3(0,0.2,-0.25);
    float e1=sdSphere(p-eyeL,0.09);
    float e2=sdSphere(p-eyeR,0.09);
    if(e1<res.x) res=vec2(e1,3.0);
    if(e2<res.x) res=vec2(e2,3.0);
    
    // Pupils
    vec3 pupilL=eyeL+dir*0.06;
    vec3 pupilR=eyeR+dir*0.06;
    float pl=sdSphere(p-pupilL,0.045);
    float pr=sdSphere(p-pupilR,0.045);
    if(pl<e1) res=vec2(pl,4.0);
    if(pr<e2) res=vec2(pr,4.0);
    
    // Teeth bumps
    for(int i=0;i<4;i++){
        float ft=float(i)/4.0*PI;
        vec3 tooth=pathPt+dir*0.35+vec3(cos(ft)*0.15,0,sin(ft)*0.15);
        float td=sdSphere(p-tooth,0.04);
        if(td<res.x) res=vec2(td,5.0);
    }
    
    return res;
}

vec2 mapScene(vec3 p,float t){
    // Swamp ground
    float ground=p.y-(-1.2+sin(p.x*0.4+t*0.25)*0.35+sin(p.z*0.6+t*0.2)*0.25);
    vec2 res=vec2(ground,6.0);
    
    // Floating debris
    for(int i=0;i<5;i++){
        float fi=float(i);
        vec3 dp=vec3(sin(t*0.3+fi*2.0)*4.0,0.1+sin(t+fi)*0.1,cos(t*0.2+fi*1.5)*4.0);
        dp.y+=sin(t*0.5+fi)*0.15;
        float ds=sdSphere(p-dp,0.2+hash(fi)*0.15);
        if(ds<res.x) res=vec2(ds,7.0);
    }
    
    // Dead branches
    for(int i=0;i<3;i++){
        float fi=float(i);
        vec3 bp=vec3(sin(fi*3.0)*3.5,-0.8,cos(fi*2.5)*3.5);
        vec3 be=bp+vec3(sin(fi*4.0+t*0.1)*0.5,0.8,cos(fi*3.5+t*0.08)*0.5);
        float db=sdCapsule(p,bp,be,0.06);
        if(db<res.x) res=vec2(db,8.0);
    }
    
    // Snake 1 - phase 0
    vec2 s1=mapSnake(p,t,0.0);
    if(s1.x<res.x) res=s1;
    
    // Snake 2 - phase PI (opposite)
    vec2 s2=mapSnake(p,t,1.0);
    if(s2.x<res.x) res=s2;
    
    return res;
}

vec3 calcNormal(vec3 p,float t){
    vec2 e=vec2(0.001,0.0);
    float d=mapScene(p,t).x;
    return normalize(vec3(mapScene(p+e.xyy,t).x-d,mapScene(p+e.yxy,t).x-d,mapScene(p+e.yyx,t).x-d));
}

float softShadow(vec3 p,vec3 lightDir,float t){
    float res=1.0;
    float dist=0.01;
    for(int i=0;i<48;i++){
        float d=mapScene(p+lightDir*dist,t).x;
        res=min(res,12.0*max(0.0,d/dist));
        dist+=clamp(d,0.02,0.2);
        if(res<0.001) break;
    }
    return clamp(res,0.0,1.0);
}

vec3 getMatColor(vec3 p,vec3 n,vec3 rd,float t,float matId){
    vec3 col=vec3(0.0);
    
    if(matId==1.0){
        // Snake clay material
        float fresnel=pow(1.0-max(0.0,dot(n,rd)),4.0);
        float pattern=sin(p.x*6.0+p.y*5.0+p.z*7.0+t*0.5)*0.5+0.5;
        vec3 base1=vec3(0.12,0.32,0.08);
        vec3 base2=vec3(0.28,0.48,0.12);
        col=mix(base1,base2,pattern);
        
        // Spots
        float spots=sin(p.x*10.0+p.y*8.0)*sin(p.z*9.0+p.y*7.0);
        spots=smoothstep(0.2,0.6,spots)*0.25;
        col+=vec3(spots*0.12,spots*0.18,spots*0.04);
        
        // Lighting
        vec3 l1=normalize(vec3(0.4,1.0,0.3));
        vec3 l2=normalize(vec3(-0.5,0.6,-0.4));
        float diff=max(0.0,dot(n,l1));
        float diff2=max(0.0,dot(n,l2))*0.25;
        
        // Subsurface scattering
        float sss=pow(max(0.0,dot(rd,-l1)),0.4)*0.35;
        
        // Soft shadow
        float shadow=softShadow(p,l1,t);
        
        // Specular (wet clay)
        vec3 hf=normalize(l1+rd);
        float spec=pow(max(0.0,dot(n,hf)),64.0)*0.35;
        
        col=col*(diff*shadow+diff2+sss)+vec3(0.015)+vec3(0.12,0.18,0.06)*spec;
        col+=fresnel*vec3(0.04,0.08,0.03);
        
        // Slight iridescence on edges
        col+=fresnel*vec3(0.1,0.2,0.05)*(0.5+0.5*sin(p.x*15.0+t));
    }
    else if(matId==2.0){
        col=vec3(0.85,0.8,0.25);
        col+=vec3(0.1);
    }
    else if(matId==3.0){
        col=vec3(0.95,0.9,0.35);
    }
    else if(matId==4.0){
        col=vec3(0.015,0.015,0.01);
    }
    else if(matId==5.0){
        col=vec3(0.9,0.88,0.8);
    }
    else if(matId==6.0){
        // Swamp water
        float wave=sin(p.x*2.5+t*0.8)*0.08+sin(p.z*3.0+t*0.6)*0.06;
        col=vec3(0.06+wave,0.13+wave*0.5,0.04);
        float shimmer=sin(p.x*6.0+p.z*5.0+t*2.5)*0.5+0.5;
        col+=vec3(0.04,0.07,0.015)*shimmer;
        
        // Foam at edges
        float foam=smoothstep(0.0,0.3,n.y)*0.15;
        col+=vec3(foam*0.15,foam*0.2,foam*0.08);
    }
    else if(matId==7.0){
        // Rotting debris
        float rot=noise(p*3.0)*0.3;
        col=vec3(0.15+rot,0.1+rot*0.5,0.05);
    }
    else if(matId==8.0){
        // Dead branch
        col=vec3(0.12,0.08,0.04);
        float bark=noise(p*8.0)*0.1;
        col+=bark;
    }
    
    return col;
}

vec3 rayMarch(vec3 ro,vec3 rd,float t){
    float dist=0.0;
    float matId=0.0;
    
    for(int i=0;i<MAX_STEPS;i++){
        vec3 p=ro+rd*dist;
        vec2 res=mapScene(p,t);
        float d=res.x;
        matId=res.y;
        if(d<SURF_DIST||dist>MAX_DIST) break;
        dist+=d*0.9;
    }
    
    if(dist>MAX_DIST) return vec3(0.03,0.05,0.02);
    
    vec3 p=ro+rd*dist;
    vec3 n=calcNormal(p,t);
    
    // Ambient
    float fog=1.0-exp(-dist*0.06);
    vec3 fogCol=vec3(0.05,0.09,0.035);
    
    vec3 col=getMatColor(p,n,rd,t,matId);
    
    // Swamp gas
    float gas=fbm(p*0.7+vec3(t*0.08,0.0,t*0.04));
    gas=smoothstep(0.35,0.75,gas)*0.25;
    col+=vec3(0.06,0.12,0.03)*gas;
    
    // Fireflies
    for(int i=0;i<6;i++){
        float fi=float(i);
        vec3 fp=vec3(sin(t*0.6+fi*2.1)*3.5,sin(t*1.2+fi*1.7)*0.6+1.2,cos(t*0.4+fi*1.3)*3.5);
        float fd=length(p-fp);
        float ff=smoothstep(0.2,0.0,fd)*(sin(t*4.0+fi*3.0)*0.5+0.5);
        col+=vec3(0.7,0.95,0.25)*ff*0.7;
    }
    
    col=mix(col,fogCol,fog);
    return col;
}

void main(){
    vec2 uv=(gl_FragCoord.xy-0.5*u_res)/u_res.y;
    float t=u_time;
    
    float camAngle=t*0.12;
    float camH=4.0+sin(t*0.18)*0.6;
    vec3 ro=vec3(sin(camAngle)*6.0,camH,cos(camAngle)*6.0);
    vec3 target=vec3(0.0,0.0,0.0);
    
    vec3 fwd=normalize(target-ro);
    vec3 right=normalize(cross(fwd,vec3(0.0,1.0,0.0)));
    vec3 up=cross(right,fwd);
    vec3 rd=normalize(fwd*1.5+right*uv.x+up*uv.y);
    
    vec3 col=rayMarch(ro,rd,t);
    
    // Vignette
    vec2 q=gl_FragCoord.xy/u_res;
    col*=1.0-0.35*length(q-0.5);
    
    // Grain
    float grain=hash2(gl_FragCoord.xy+fract(t))*0.025;
    col+=grain-0.0125;
    
    // Color grade
    col=pow(col,vec3(0.92,0.98,0.88));
    
    // Tone map
    col=col/(col+0.7);
    
    // Chromatic aberration
    float ca=length(uv)*0.012;
    col.r*=1.0+ca;
    col.b*=1.0-ca;
    
    // Subtle green tint
    col.g*=1.05;
    
    fragColor=vec4(col,1.0);
}`;

function createShader(gl, type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
        gl.deleteShader(s);
        return null;
    }
    return s;
}

function createProgram(gl, vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(p));
        return null;
    }
    return p;
}

const vs = createShader(gl, gl.VERTEX_SHADER, vsSource2);
const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource2);
const program = createProgram(gl, vs, fs);

const posBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(program, 'u_res');
const uTime = gl.getUniformLocation(program, 'u_time');

gl.enable(gl.DEPTH_TEST);

function render(time) {
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, time * 0.001);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
