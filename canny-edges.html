<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canny Edge Shader</title>
    <!-- Load p5.js -->
    <script src="common/js/libraries/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script id="canny-edges-vs" type="x-shader/x-vertex">
#version 300 es
precision highp float;

in vec3 aPosition;
in vec2 aTexCoord;

out vec2 vTexCoord;

void main() {
    // Copy the p5.js texture coordinates to the fragment shader
    vTexCoord = aTexCoord;

    // Convert vec3 position to vec4
    vec4 positionVec4 = vec4(aPosition, 1.0);

    // Scale the rect from p5's coordinate system to WebGL's coordinate system
    positionVec4.xy = positionVec4.xy * 2.0 - 1.0;

    // Set the output vertex position
    gl_Position = positionVec4;
}
    </script>
    <script id="canny-edges-fs" type="x-shader/x-fragment">
#version 300 es
precision highp float;

in vec2 vTexCoord;

uniform sampler2D uTexture;
uniform vec2 uResolution;
uniform vec2 uTextureSize;

out vec4 fragColor;

const float lowThreshold = 0.05;
const float highThreshold = 0.15;
const float pi = 3.14159265359;

float luminance(vec3 c) {
    return dot(c, vec3(0.2126, 0.7152, 0.0722));
}

// 3x3 box blur of luminance for noise reduction
float blurredLum(vec2 uv, vec2 texelSize) {
    float sum = 0.0;
    for (int x = -1; x <= 1; x++) {
        for (int y = -1; y <= 1; y++) {
            sum += luminance(texture(uTexture, uv + vec2(float(x), float(y)) * texelSize).rgb);
        }
    }
    return sum / 9.0;
}

// Compute gradient magnitude and direction with Sobel on blurred luminance
struct Gradient {
    float magnitude;
    float direction;
};

Gradient computeGradient(vec2 uv, vec2 texelSize) {
    float tl = blurredLum(uv + vec2(-texelSize.x, -texelSize.y), texelSize);
    float tc = blurredLum(uv + vec2(0.0, -texelSize.y), texelSize);
    float tr = blurredLum(uv + vec2(texelSize.x, -texelSize.y), texelSize);
    float ml = blurredLum(uv + vec2(-texelSize.x, 0.0), texelSize);
    float mr = blurredLum(uv + vec2(texelSize.x, 0.0), texelSize);
    float bl = blurredLum(uv + vec2(-texelSize.x, texelSize.y), texelSize);
    float bc = blurredLum(uv + vec2(0.0, texelSize.y), texelSize);
    float br = blurredLum(uv + vec2(texelSize.x, texelSize.y), texelSize);

    float gx = (tr + 2.0 * mr + br) - (tl + 2.0 * ml + bl);
    float gy = (bl + 2.0 * bc + br) - (tl + 2.0 * tc + tr);

    float magnitude = length(vec2(gx, gy)) / 4.0;
    float direction = atan(gy, gx);
    direction = direction > 0.0 ? direction : direction + pi;

    return Gradient(magnitude, direction);
}

// Non-maximum suppression: compare against neighbor magnitudes
// along the gradient direction
float nonMaxSuppression(vec2 uv, vec2 texelSize, Gradient g) {
    float angle = g.direction;
    int quadrant = int(floor(mod(angle + pi/4.0, pi) * 4.0 / pi));

    vec2 offset;
    if (quadrant == 0) {
        offset = vec2(texelSize.x, 0.0);
    } else if (quadrant == 1) {
        offset = vec2(texelSize.x, texelSize.y);
    } else if (quadrant == 2) {
        offset = vec2(0.0, texelSize.y);
    } else {
        offset = vec2(-texelSize.x, texelSize.y);
    }

    float m1 = computeGradient(uv + offset, texelSize).magnitude;
    float m2 = computeGradient(uv - offset, texelSize).magnitude;

    return g.magnitude >= m1 && g.magnitude >= m2 ? g.magnitude : 0.0;
}

// Hysteresis thresholding (simplified single-pass approximation:
// strong edges white, weak edges dim)
float hysteresis(float mag) {
    if (mag >= highThreshold) return 1.0;
    if (mag >= lowThreshold) return 0.35;
    return 0.0;
}

// Canny edge detection main function
vec3 canny(vec2 uv, vec2 texelSize) {
    Gradient g = computeGradient(uv, texelSize);
    float nms = nonMaxSuppression(uv, texelSize, g);
    float edge = hysteresis(nms);
    return vec3(edge);
}

void main() {
    // Fixed: Ensure texelSize maps to the actual texture size (uTextureSize is now correctly passed)
    vec2 texelSize = vec2(1.0) / uTextureSize;
    
    // Use the texture coordinates provided from the vertex shader.
    // p5.js has inverted y-coordinates, so flip it here if needed.
    vec2 uv = vTexCoord;
    uv.y = 1.0 - uv.y;
    
    vec3 edge = canny(uv, texelSize);
    
    // Output to fragColor as required by WebGL2 / GLSL ES 3.00
    fragColor = vec4(edge, 1.0);
}
    </script>
    <script>
let edgeShader;
let img;

function preload() {
    // Load the image
    img = loadImage('./common/images/aah_skeleton.jpg');
}

function setup() {
    createCanvas(windowWidth, windowHeight, WEBGL);

    // Load the shaders from the inline script tags
    const vertSrc = document.getElementById('canny-edges-vs').textContent.trim();
    const fragSrc = document.getElementById('canny-edges-fs').textContent.trim();
    edgeShader = createShader(vertSrc, fragSrc);
    noStroke();
    imageMode(CENTER);
}

function draw() {
    background(0);

    // Calculate aspect ratios to fit the image inside the canvas nicely
    let imgAspect = img.width / img.height;
    let canvasAspect = width / height;
    
    let drawWidth, drawHeight;
    if (canvasAspect > imgAspect) {
        drawHeight = height * 0.9;
        drawWidth = drawHeight * imgAspect;
    } else {
        drawWidth = width * 0.9;
        drawHeight = drawWidth / imgAspect;
    }

    // Apply the shader
    shader(edgeShader);

    // Set uniforms that the shader expects
    edgeShader.setUniform('uTexture', img);
    edgeShader.setUniform('uResolution', [drawWidth, drawHeight]);
    edgeShader.setUniform('uTextureSize', [img.width, img.height]);

    // Draw a rectangle that covers the canvas where the shader will be applied
    rect(-drawWidth/2, -drawHeight/2, drawWidth, drawHeight);
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
}
    </script>
</body>
</html>
